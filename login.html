<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <title>Log In | Pro Love Hub</title>
    <meta name="description" content="Log in to your Pro Love Hub account and continue your journey.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">

    <!-- ⚡ Preload members page for instant redirect -->
    <link rel="prefetch" href="members.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #FFF5F8;
            color: #1a0a14;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: pageFadeIn 0.35s ease;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body.page-leaving {
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        a { text-decoration: none; color: inherit; }

        /* ============================================================ */
        /* BRAND LOGO                                                    */
        /* ============================================================ */
        .brand-logo {
            display: inline-flex;
            align-items: flex-end;
            gap: 4px;
            text-decoration: none;
            line-height: 1;
            position: relative;
            padding: 8px 0 4px;
            transition: transform 0.25s ease;
            flex-shrink: 0;
        }
        .brand-logo:hover { transform: translateY(-1px); }
        .brand-logo__pro {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: #F7266D;
            letter-spacing: -1.3px;
            line-height: 1;
            position: relative;
            top: -7px;
        }
        .brand-logo__stack {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 0.9;
            margin-left: 2px;
        }
        .brand-logo__hearts {
            position: absolute;
            top: -16px;
            left: 7px;
            font-size: 10px;
            color: #F7266D;
            line-height: 1;
            font-family: "Inter", sans-serif;
            pointer-events: none;
        }
        .brand-logo__hearts::before {
            content: '♥';
            font-size: 13px;
            position: absolute;
            top: -5px;
            left: 12px;
        }
        .brand-logo__hearts::after {
            content: '♥';
            font-size: 8px;
            position: absolute;
            top: 0;
            left: 24px;
        }
        .brand-logo__love {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 24px;
            font-weight: 700;
            font-style: italic;
            color: #1E88E5;
            letter-spacing: -1.3px;
            line-height: 1;
            position: relative;
            top: -4px;
            display: inline-flex;
            align-items: baseline;
        }
        .brand-logo__love .l { color: #1E88E5; }
        .brand-logo__love .heart-o {
            color: #F7266D;
            font-style: normal;
            font-family: "Inter", sans-serif;
            font-size: 17px;
            font-weight: 900;
            display: inline-block;
            transform: translateY(-1px) scaleX(1.1);
            margin: 0 1px;
            line-height: 1;
            text-shadow: 0 0 8px rgba(247, 38, 109, 0.35);
        }
        .brand-logo__hub {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 15px;
            font-weight: 900;
            color: #F7266D;
            letter-spacing: -0.7px;
            line-height: 1;
            margin-top: 2px;
            margin-left: 5px;
        }
        @media (max-width: 480px) {
            .brand-logo__pro { font-size: 20px; top: -5px; }
            .brand-logo__love { font-size: 18px; top: -3px; }
            .brand-logo__love .heart-o { font-size: 13px; }
            .brand-logo__hub { font-size: 12px; margin-left: 4px; }
            .brand-logo__hearts { font-size: 7px; top: -11px; left: 4px; }
            .brand-logo__hearts::before { font-size: 10px; top: -4px; left: 9px; }
            .brand-logo__hearts::after { font-size: 6px; top: 0; left: 18px; }
        }

        /* HEADER */
        .cb-shell-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(247, 38, 109, 0.12);
        }

        .cb-shell-header__inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cb-shell-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cb-shell-button {
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: "Inter", sans-serif;
        }
        .cb-shell-button--secondary {
            background: rgba(247, 38, 109, 0.1);
            color: #1a0a14;
            border: 1px solid rgba(247, 38, 109, 0.12);
        }
        .cb-shell-button--secondary:hover {
            background: rgba(247, 38, 109, 0.18);
        }
        .cb-shell-button--primary {
            background: linear-gradient(135deg, #F7266D, #C41E56);
            color: #fff;
        }
        .cb-shell-button--primary:hover {
            background: linear-gradient(135deg, #C41E56, #F7266D);
            transform: translateY(-2px);
        }

        /* WRAPPER */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 60px;
            min-height: 100vh;
            position: relative;
            background: radial-gradient(ellipse at center top, rgba(247, 38, 109, 0.06), transparent 70%);
        }

        /* Floating hearts */
        .floating-hearts-login {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .heart-login {
            position: absolute;
            animation: floatUpLogin 14s infinite linear;
            opacity: 0;
            filter: drop-shadow(0 0 6px rgba(247, 38, 109, 0.5));
        }
        @keyframes floatUpLogin {
            0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 0.4; transform: translateY(90vh) rotate(10deg) scale(1); }
            90% { opacity: 0.4; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        /* CARD */
        .login-card {
            max-width: 440px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px 40px;
            border: 1px solid rgba(247, 38, 109, 0.15);
            box-shadow: 0 20px 60px rgba(247, 38, 109, 0.12);
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .login-card.login-success {
            transform: scale(0.96);
            opacity: 0.6;
            pointer-events: none;
        }

        .login-card__header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-card__header .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .login-card__header h1 {
            font-family: "Playfair Display", Georgia, 'Times New Roman', serif;
            font-size: 30px;
            color: #1a0a14;
            font-weight: 700;
        }

        .login-card__header p {
            color: rgba(26, 10, 20, 0.55);
            font-size: 14px;
            margin-top: 4px;
        }

        /* FORM */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: rgba(26, 10, 20, 0.7);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(247, 38, 109, 0.15);
            border-radius: 12px;
            color: #1a0a14;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            font-family: "Inter", sans-serif;
        }

        .form-group input::placeholder {
            color: rgba(26, 10, 20, 0.3);
        }

        .form-group input:focus {
            border-color: #F7266D;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 4px rgba(247, 38, 109, 0.1);
        }

        /* Pre-filled email styling */
        .form-group input.prefilled {
            background: rgba(247, 38, 109, 0.04);
            border-color: rgba(247, 38, 109, 0.25);
            color: rgba(26, 10, 20, 0.85);
            font-weight: 600;
        }

        .form-options {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 22px;
        }

        .form-options a {
            color: rgba(26, 10, 20, 0.5);
            font-size: 13px;
            transition: color 0.3s ease;
            font-weight: 500;
        }

        .form-options a:hover {
            color: #F7266D;
        }

        /* BUTTON */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #F7266D, #C41E56);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: "Inter", sans-serif;
            letter-spacing: 0.3px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(247, 38, 109, 0.35);
            background: linear-gradient(135deg, #C41E56, #F7266D);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* MESSAGES */
        .error-message,
        .success-message {
            display: none;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.08);
            border: 1px solid rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.08);
            border: 1px solid rgba(40, 167, 69, 0.2);
            color: #28a745;
        }

        .error-message.show,
        .success-message.show {
            display: block;
        }

        .error-message.show {
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        /* FOOTER */
        .login-footer {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(247, 38, 109, 0.1);
        }

        .login-footer p {
            color: rgba(26, 10, 20, 0.5);
            font-size: 14px;
        }

        .login-footer a {
            color: #F7266D;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: #C41E56;
            text-decoration: underline;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px 28px;
                border-radius: 20px;
            }
            .login-card__header h1 { font-size: 24px; }
            .cb-shell-header__inner { height: 58px; padding: 0 14px; }
            .cb-shell-button { padding: 6px 16px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="cb-shell-header" role="banner">
        <div class="cb-shell-header__inner">
            <a class="brand-logo" href="index.html" aria-label="Pro Love Hub">
                <span class="brand-logo__pro">Pro</span>
                <span class="brand-logo__stack">
                    <span class="brand-logo__hearts">♥</span>
                    <span class="brand-logo__love">
                        <span class="l">L</span><span class="heart-o">♥</span><span class="l">ve</span>
                    </span>
                    <span class="brand-logo__hub">Hub</span>
                </span>
            </a>
            <div class="cb-shell-actions">
                <a href="signup.html" class="cb-shell-button cb-shell-button--secondary">Join</a>
                <a href="login.html" class="cb-shell-button cb-shell-button--primary">Log in</a>
            </div>
        </div>
    </header>

    <!-- LOGIN -->
    <main class="login-wrapper">
        <div class="floating-hearts-login">
            <span class="heart-login" style="left:5%;animation-delay:0s;font-size:18px;">❤️</span>
            <span class="heart-login" style="left:15%;animation-delay:2s;font-size:24px;">💕</span>
            <span class="heart-login" style="left:25%;animation-delay:4s;font-size:14px;">❤️‍🔥</span>
            <span class="heart-login" style="left:35%;animation-delay:1s;font-size:28px;">💗</span>
            <span class="heart-login" style="left:45%;animation-delay:3s;font-size:18px;">❤️</span>
            <span class="heart-login" style="left:55%;animation-delay:5s;font-size:16px;">💖</span>
            <span class="heart-login" style="left:65%;animation-delay:1.5s;font-size:26px;">❤️‍🔥</span>
            <span class="heart-login" style="left:75%;animation-delay:3.5s;font-size:18px;">💕</span>
            <span class="heart-login" style="left:85%;animation-delay:4.5s;font-size:22px;">❤️</span>
            <span class="heart-login" style="left:95%;animation-delay:2.5s;font-size:16px;">💗</span>
        </div>

        <div class="login-card" id="login-card">
            <div class="login-card__header">
                <span class="icon">💎</span>
                <h1>Welcome Back</h1>
                <p>Log in to continue your journey to love</p>
            </div>

            <div class="error-message" id="error-message">⚠️ Invalid email or password.</div>
            <div class="success-message" id="success-message">✅ Login successful! Taking you in...</div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <div class="form-options">
                    <a href="signup.html">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login" id="login-btn">🔐 Log In</button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>
        </div>
    </main>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
            }
        }
    </script>

    <script type="module">
        import { createClient } from "@supabase/supabase-js";

        const SUPABASE_URL = 'https://eyoxtxnnwahaqgewckrk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1-qc4RNgrX7bgfHMapJnUw_DS1giSZK';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('🔗 Supabase connected:', SUPABASE_URL);

        // ============================================================
        // Cache DOM references after DOM is ready
        // ============================================================
        let form, btn, errorMessage, successMessage, loginCard;

        document.addEventListener('DOMContentLoaded', () => {
            form = document.getElementById('login-form');
            btn = document.getElementById('login-btn');
            errorMessage = document.getElementById('error-message');
            successMessage = document.getElementById('success-message');
            loginCard = document.getElementById('login-card');

            // ============================================================
            // Pre-fill email from ?email= parameter (from signup redirect)
            // ============================================================
            const urlParams = new URLSearchParams(window.location.search);
            const prefilledEmail = urlParams.get('email');

            if (prefilledEmail) {
                const emailField = document.getElementById('email');
                if (emailField) {
                    emailField.value = decodeURIComponent(prefilledEmail);
                    emailField.classList.add('prefilled');
                    emailField.setAttribute('readonly', 'readonly');
                    // Focus password field so user can immediately type it
                    setTimeout(() => {
                        const pwField = document.getElementById('password');
                        if (pwField) pwField.focus();
                    }, 200);
                }
            }

            // ============================================================
            // Reset error state on new input
            // ============================================================
            ['email', 'password'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('input', () => {
                    if (errorMessage) errorMessage.classList.remove('show');
                    if (successMessage) successMessage.classList.remove('show');
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = '🔐 Log In';
                        btn.style.background = '';
                    }
                    if (loginCard) loginCard.classList.remove('login-success');
                });
            });
        });

        // ============================================================
        // Resolve redirect target — default members.html, supports ?redirect=
        // ============================================================
        function getRedirectTarget() {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect');
            if (redirect) {
                try {
                    const decoded = decodeURIComponent(redirect);
                    if (decoded.startsWith('/') || decoded.match(/^[a-zA-Z0-9_\-]+\.html/)) {
                        return decoded;
                    }
                } catch (e) {}
            }
            return 'members.html';
        }

        // ============================================================
        // Smooth redirect — fade out page, then navigate
        // ============================================================
        function smoothRedirect(url, delay = 250) {
            document.body.classList.add('page-leaving');
            setTimeout(() => {
                window.location.href = url;
            }, delay);
        }

        // ============================================================
        // SESSION CHECK — runs immediately
        // If already logged in → smooth redirect
        // ============================================================
        (async function checkSession() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session && session.user) {
                    console.log('✅ Already logged in:', session.user.email);
                    smoothRedirect(getRedirectTarget(), 200);
                }
            } catch (err) {
                console.warn('Session check failed:', err);
            }
        })();

        // ============================================================
        // LOGIN HANDLER — fast redirect on success
        // ============================================================
        window.handleLogin = async function(event) {
            event.preventDefault();

            if (!btn) btn = document.getElementById('login-btn');
            if (!errorMessage) errorMessage = document.getElementById('error-message');
            if (!successMessage) successMessage = document.getElementById('success-message');
            if (!loginCard) loginCard = document.getElementById('login-card');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            if (!email || !email.includes('@')) {
                errorMessage.textContent = '⚠️ Please enter a valid email address.';
                errorMessage.classList.add('show');
                return;
            }

            if (!password || password.length < 6) {
                errorMessage.textContent = '⚠️ Password must be at least 6 characters.';
                errorMessage.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Logging in...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    let msg = '⚠️ ';
                    if (error.message.includes('Invalid login credentials')) {
                        msg += 'Invalid email or password.';
                    } else if (error.message.includes('Email not confirmed')) {
                        msg += 'Email not confirmed. Please check your inbox.';
                    } else if (error.message.includes('Too many requests')) {
                        msg += 'Too many attempts. Please try again later.';
                    } else {
                        msg += error.message;
                    }
                    errorMessage.textContent = msg;
                    errorMessage.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = '🔐 Log In';
                    return;
                }

                if (!data || !data.user) {
                    errorMessage.textContent = '⚠️ Login failed. Please try again.';
                    errorMessage.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = '🔐 Log In';
                    return;
                }

                console.log('✅ Login successful:', data.user.email);

                successMessage.textContent = '✅ Login successful! Taking you in...';
                successMessage.classList.add('show');
                btn.textContent = '✅ Logged In!';
                btn.style.background = 'linear-gradient(135deg, #28a745, #1e7e34)';

                loginCard.classList.add('login-success');

                const target = getRedirectTarget();
                smoothRedirect(target, 400);

            } catch (err) {
                console.error('Unexpected login error:', err);
                errorMessage.textContent = '⚠️ Unexpected error. Please try again.';
                errorMessage.classList.add('show');
                btn.disabled = false;
                btn.textContent = '🔐 Log In';
            }
        }

        console.log('💎 Pro Love Hub Login — pink + blue palette');
        console.log('✅ Redirect target: members.html (default)');
        console.log('✅ Supports ?email= pre-fill and ?redirect= parameter');
    </script>

</body>
</html>
