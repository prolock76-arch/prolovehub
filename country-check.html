<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Payment - Pro Love Hub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Inter", sans-serif;
            background: #FFF5F8;
            color: #1a0a14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(247, 38, 109, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(247, 38, 109, 0.1);
        }
        .icon { font-size: 48px; margin-bottom: 16px; display: block; }
        h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #1a0a14; }
        p { font-size: 14px; color: rgba(26, 10, 20, 0.6); margin-bottom: 24px; line-height: 1.5; }
        select {
            width: 100%; padding: 14px 16px;
            border: 2px solid rgba(247, 38, 109, 0.2);
            border-radius: 12px; font-size: 15px;
            font-family: "Inter", sans-serif;
            background: #fff; color: #1a0a14;
            margin-bottom: 20px; outline: none; cursor: pointer;
            transition: border-color 0.2s;
        }
        select:focus { border-color: #F7266D; }
        .btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #F7266D, #C41E56);
            color: #fff; border: none; border-radius: 50px;
            font-size: 16px; font-weight: 700;
            font-family: "Inter", sans-serif; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(247, 38, 109, 0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(247, 38, 109, 0.4); }
        .btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
        .error-msg {
            display: none;
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            padding: 14px; border-radius: 10px;
            font-size: 13px; font-weight: 600;
            margin-top: 16px; line-height: 1.5;
        }
        .error-msg.show { display: block; }
        .wa-fallback {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; margin-top: 16px; padding: 12px 20px;
            background: rgba(37, 211, 102, 0.1);
            color: #128C7E; border-radius: 50px;
            text-decoration: none; font-weight: 600; font-size: 13px;
            border: 1px solid rgba(37, 211, 102, 0.3);
            transition: background 0.2s;
        }
        .wa-fallback:hover { background: rgba(37, 211, 102, 0.2); }
        .back-link {
            display: block;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(26, 10, 20, 0.5);
            text-decoration: none;
        }
        .back-link:hover { color: #F7266D; }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🌍</span>
        <h2>Where are you paying from?</h2>
        <p>Select your country to continue with secure payment</p>

        <select id="countrySelect">
            <option value="">-- Select Country --</option>
            <option value="KE">Kenya 🇰🇪</option>
            <option value="NG">Nigeria 🇳🇬</option>
            <option value="GH">Ghana 🇬🇭</option>
            <option value="ZA">South Africa 🇿🇦</option>
            <option value="OTHER">Other Country</option>
        </select>

        <button class="btn" id="proceedBtn" onclick="checkCountry()">Continue to Payment →</button>

        <div class="error-msg" id="errorMsg">
            We currently cannot process payments from your country.<br>
            Please tap below to reach us on WhatsApp.
        </div>

        <a class="wa-fallback" id="waFallback" href="#" target="_blank" rel="noopener" style="display:none;">
            💬 Chat with us on WhatsApp
        </a>

        <a class="back-link" id="backLink" href="#">← Back to chat</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const conversationId = urlParams.get('conversation');
        const reference = urlParams.get('reference');
        const amountCents = urlParams.get('amount');
        const whatsappNumber = '254117044510';

        // WhatsApp fallback
        const waMsg = encodeURIComponent(`Hi Pro Love Hub, I'd like to book a private connection for conversation ${conversationId}.`);
        document.getElementById('waFallback').href = `https://wa.me/${whatsappNumber}?text=${waMsg}`;

        // Back link
        document.getElementById('backLink').href = `chat.html?conversation=${conversationId}`;

        function checkCountry() {
            const country = document.getElementById('countrySelect').value;
            const proceedBtn = document.getElementById('proceedBtn');
            const errorMsg = document.getElementById('errorMsg');
            const waFallback = document.getElementById('waFallback');

            if (!country) return alert('Please select a country');

            const supported = ['KE', 'NG', 'GH', 'ZA'];

            if (supported.includes(country)) {
                proceedBtn.disabled = true;
                proceedBtn.textContent = 'Redirecting to payment...';

                // Send user back to chat.html with proceed=pay flag
                const targetUrl = `chat.html?conversation=${conversationId}&reference=${reference}&amount=${amountCents}&country=${country}&proceed=pay`;
                window.location.href = targetUrl;
            } else {
                errorMsg.classList.add('show');
                waFallback.style.display = 'inline-flex';
                proceedBtn.disabled = true;
                proceedBtn.textContent = 'Not Available';
            }
        }
    </script>
</body>
</html>
