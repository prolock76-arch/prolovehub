<html lang="en">
<head>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #FFF5F8;
            color: #1a0a14;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
        }

        a { text-decoration: none; color: inherit; }

        /* ... [ALL EXISTING CSS UNCHANGED — copy from your current file] ... */

        .pay-book-btn { /* unchanged */ }
        .wa-book-btn { /* unchanged */ }

        /* Smooth transition overlay */
        .smooth-transition-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #FFF5F8 0%, #FFE8F0 100%);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .smooth-transition-overlay.show {
            display: flex;
            opacity: 1;
        }
        .smooth-transition-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(247, 38, 109, 0.15);
            border-top-color: #F7266D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .smooth-transition-overlay .label {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 16px;
            font-weight: 700;
            color: #F7266D;
            letter-spacing: 0.3px;
        }
        .smooth-transition-overlay .sub {
            font-size: 12px;
            color: rgba(26, 10, 20, 0.5);
            font-weight: 600;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ... [REST OF CSS UNCHANGED] ... */
    </style>
</head>
<body>

    <!-- ... [ALL EXISTING HTML UNCHANGED] ... -->

    <!-- Smooth transition overlay (add before </body>) -->
    <div class="smooth-transition-overlay" id="transitionOverlay">
        <div class="spinner"></div>
        <div class="label">Preparing secure checkout</div>
        <div class="sub">Please wait a moment…</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
            }
        }
    </script>

    <script type="module">
        import { createClient } from "@supabase/supabase-js";

        const SUPABASE_URL = 'https://eyoxtxnnwahaqgewckrk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1-qc4RNgrX7bgfHMapJnUw_DS1giSZK';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // PRICING — single source of truth
        // ============================================================
        // 💵 Base price in USD — this is what the user sees everywhere
        const BOOKING_FEE_USD = 12.99;

        // 💱 Fallback FX rates (per 1 USD) — used for local currency display
        const FX_RATES = {
            KES: 129.5,
            NGN: 1550,
            GHS: 15.2,
            ZAR: 18.6,
            USD: 1
        };

        // 🔁 Compute KES equivalent once — this is what Paystack charges
        const BOOKING_FEE_KES = Math.round(BOOKING_FEE_USD * FX_RATES.KES); // = 1682
        const BOOKING_FEE_CENTS = BOOKING_FEE_KES * 100;
        const CURRENCY = 'KES';

        console.log(`💰 USD: $${BOOKING_FEE_USD} · KES charged: ${BOOKING_FEE_KES}`);

        // ============================================================
        // COUNTRY CONFIG
        // ============================================================
        const COUNTRY_CONFIG = {
            KE:    { name: 'Kenya',        flag: '🇰🇪', currency: 'KES', symbol: 'KSh',  hint: "M-PESA prioritised · Card also available", icon: '📱', isMpesa: true  },
            NG:    { name: 'Nigeria',      flag: '🇳🇬', currency: 'NGN', symbol: '₦',    hint: "You'll pay with Visa or Mastercard",      icon: '💳', isMpesa: false },
            GH:    { name: 'Ghana',        flag: '🇬🇭', currency: 'GHS', symbol: 'GH₵',  hint: "You'll pay with Visa or Mastercard",      icon: '💳', isMpesa: false },
            ZA:    { name: 'South Africa', flag: '🇿🇦', currency: 'ZAR', symbol: 'R',    hint: "You'll pay with Visa or Mastercard",      icon: '💳', isMpesa: false },
            OTHER: { name: 'International', flag: '🌍', currency: 'USD', symbol: '$',    hint: "You'll pay with Visa or Mastercard",      icon: '💳', isMpesa: false }
        };

        const WHATSAPP_NUMBER = '254117044510';
        const WHATSAPP_MESSAGE = "Hi Pro Love Hub, I'd like to book a private connection. I am ready with the required fee";

        const ADMIN_AUTO_REPLY = `Hi 👋 Welcome to Pro Love Hub. We've received your details and your match request is being reviewed. For a faster and more private experience, tap 🔓 Unlock Private Connection below. Our team will reach out on WhatsApp once payment is confirmed. 💎`;

        // ... [rest of state declarations unchanged] ...

        const countryModalOverlay = document.getElementById('countryModalOverlay');
        const transitionOverlay = document.getElementById('transitionOverlay');

        // ============================================================
        // COUNTRY PRICE CALCULATOR
        // - For every country, the amount shown = $12.99 converted
        //   to their local currency at the FX rate.
        // - Paystack will charge the KES equivalent (1,682).
        // ============================================================
        function getCountryPrice(countryCode) {
            const config = COUNTRY_CONFIG[countryCode] || COUNTRY_CONFIG.OTHER;
            const rate = FX_RATES[config.currency] || 1;
            const amount = BOOKING_FEE_USD * rate;

            let formatted;
            if (amount >= 1000) {
                formatted = amount.toLocaleString(undefined, { maximumFractionDigits: 0 });
            } else {
                formatted = amount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            return {
                display: `${config.symbol}${formatted} ${config.currency}`,
                code: config.currency,
                amount: amount
            };
        }

        // ============================================================
        // MODAL PRICE UPDATE
        // ============================================================
        function updateModalPrice(countryCode, isDefault) {
            const priceBox = document.getElementById('modalPriceBox');
            const usdEl = document.getElementById('modalUsdPrice');
            const kesEl = document.getElementById('modalKesPrice');
            const methodRow = document.getElementById('modalMethodRow');
            const methodText = document.getElementById('modalMethodText');
            const methodIcon = document.getElementById('modalMethodIcon');

            if (isDefault || !countryCode) {
                usdEl.textContent = `$${BOOKING_FEE_USD} USD`;
                kesEl.textContent = `Select your country to see local price`;
                if (methodRow) methodRow.classList.add('hidden');
            } else {
                const price = getCountryPrice(countryCode);
                const config = COUNTRY_CONFIG[countryCode] || COUNTRY_CONFIG.OTHER;

                // 👉 Show the LOCAL currency amount (converted from $12.99)
                usdEl.textContent = price.display;

                // Sub-label clarifies what's charged
                if (countryCode === 'KE') {
                    // For Kenya, the shown amount IS what Paystack charges
                    kesEl.textContent = `Pay KES ${price.amount.toLocaleString()} on checkout`;
                } else {
                    // For others, the actual charge on Paystack is still KES
                    kesEl.textContent = `≈ $${BOOKING_FEE_USD} USD · charged as KES ${BOOKING_FEE_KES.toLocaleString()}`;
                }

                if (methodRow && methodText && methodIcon) {
                    methodText.textContent = config.hint;
                    methodIcon.textContent = config.icon;
                    methodRow.classList.toggle('mpesa', config.isMpesa);
                    methodRow.classList.remove('hidden');
                }
            }

            priceBox.classList.remove('flash');
            void priceBox.offsetWidth;
            priceBox.classList.add('flash');
        }

        // ============================================================
        // SMOOTH TRANSITION + PAYSTACK REDIRECT (no "Redirecting…" flash)
        // ============================================================
        async function executePaystackPayment(reference, country) {
            paymentInFlight = true;
            const config = COUNTRY_CONFIG[country] || COUNTRY_CONFIG.OTHER;
            const countryPrice = getCountryPrice(country);

            // Show smooth overlay — no jarring text swap
            transitionOverlay.classList.add('show');

            try {
                console.log('💳 Initializing Paystack:', { reference, country, amount: BOOKING_FEE_CENTS });

                const { data, error } = await supabase.functions.invoke('paystack-initialize', {
                    body: {
                        amount: BOOKING_FEE_CENTS,
                        email: currentUser.email,
                        reference: reference,
                        currency: CURRENCY,
                        country: country,
                        callback_url: `${window.location.origin}/chat.html?conversation=${conversationId}&reference=${reference}`,
                        metadata: {
                            conversation_id: conversationId,
                            user_id: currentUser.id,
                            member_name: conversation.member_name || '',
                            full_name: conversation.full_name || '',
                            country: country,
                            country_name: config.name,
                            local_currency: countryPrice.code,
                            local_amount: countryPrice.amount,
                            usd_display: BOOKING_FEE_USD,
                            payment_reason: 'Private connection booking fee'
                        }
                    }
                });

                if (error) {
                    throw new Error((data?.error) || (data?.message) || error.message || 'Failed to initialize payment');
                }
                if (!data || !data.authorization_url) {
                    throw new Error(data?.error || data?.message || `No checkout URL returned`);
                }

                await supabase.from('conversations')
                    .update({ payment_status: 'pending', payment_reference: reference })
                    .eq('id', conversationId);

                // Smooth fade — hold the overlay a moment so it feels natural
                setTimeout(() => {
                    window.location.href = data.authorization_url;
                }, 600);

            } catch (err) {
                console.error('Payment start failed:', err);
                transitionOverlay.classList.remove('show');
                showToast('❌ ' + (err.message || 'Payment failed. Please try again.'), 'error');
                paymentInFlight = false;

                const proceedBtn = document.getElementById('modalProceedBtn');
                if (proceedBtn) {
                    proceedBtn.disabled = false;
                    proceedBtn.textContent = 'Unlock My Connection →';
                }
            }
        }

        // ============================================================
        // CONFIRM — no more "Preparing secure checkout..." button text
        // ============================================================
        window.confirmCountryAndPay = async function() {
            const countrySelect = document.getElementById('modalCountrySelect');
            const country = countrySelect.value;
            const proceedBtn = document.getElementById('modalProceedBtn');
            const inlineError = document.getElementById('modalInlineError');

            if (!country) {
                inlineError.classList.add('show');
                countrySelect.classList.add('shake');
                setTimeout(() => countrySelect.classList.remove('shake'), 500);
                setTimeout(() => inlineError.classList.remove('show'), 4000);
                return;
            }

            inlineError.classList.remove('show');

            // Close modal gracefully — overlay takes over
            countryModalOverlay.classList.remove('show');

            const reference = `PLH_${conversationId.slice(0, 8)}_${Date.now()}`;
            try {
                localStorage.setItem('plh_pending_reference', reference);
                localStorage.setItem('plh_pending_conversation', conversationId);
            } catch (e) {}

            await executePaystackPayment(reference, country);
        };

        // ... [rest of code unchanged] ...
    </script>

</body>
</html>
